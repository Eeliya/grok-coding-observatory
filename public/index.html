<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coding Observatory</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234fc1ff'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lucide-static@1.49.0/font/lucide.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <span class="logo"
        ><span class="mark" aria-hidden="true"><span class="dot" id="dot"></span></span
        ><span class="logo-text">Coding Observatory</span></span
      >
      <button id="repo" class="repo-btn" title="Choose the repository to watch">
        <span id="repo-name">Choose repo…</span>
        <i class="icon-chevron-down caret" aria-hidden="true"></i>
      </button>
      <span id="branch" class="branch" hidden></span>
      <div class="modebar" role="group" aria-label="Mode and commit navigation">
        <button id="commit-prev" class="icon" title="Browse commits: latest commit ([ or Shift+←)">
          <i class="icon-chevrons-left" aria-hidden="true"></i>
        </button>
        <div id="mode" class="mode mode-live">
          <span id="mode-live"><i class="icon-radio" aria-hidden="true"></i> Live</span>
          <span id="mode-other" hidden></span>
          <span id="mode-commit" hidden>
            <i class="icon-git-commit-horizontal" aria-hidden="true"></i>
            <code id="cb-sha"></code>
            <span id="cb-subject"></span>
            <span id="cb-pos"></span>
          </span>
        </div>
        <button id="commit-next" class="icon" title="Newer commit (] or Shift+→)" disabled>
          <i class="icon-chevrons-right" aria-hidden="true"></i>
        </button>
        <button id="cb-play" class="play-btn" hidden title="Play this commit from the start">
          <i class="icon-play" aria-hidden="true"></i> Play
        </button>
      </div>
      <span class="spacer"></span>
      <div id="agent-status" class="agent-status" hidden>
        <button id="as-chip" class="as-chip" aria-haspopup="true" aria-expanded="false"></button>
        <div id="as-pop" class="as-pop" hidden></div>
      </div>
      <div class="fontsize" role="group" aria-label="Code font size">
        <button id="font-dec" class="icon" title="Smaller code font">
          <i class="icon-a-arrow-down" aria-hidden="true"></i>
        </button>
        <button id="font-size" class="font-px" title="Code font size — click to reset to 11px">
          11px
        </button>
        <button id="font-inc" class="icon" title="Larger code font">
          <i class="icon-a-arrow-up" aria-hidden="true"></i>
        </button>
      </div>
      <label class="speed">
        <span class="speed-label">Speed</span>
        <select id="speed">
          <option value="slow">Slow</option>
          <option value="normal">Normal</option>
          <option value="fast">Fast</option>
          <option value="turbo">Turbo</option>
          <option value="instant">Instant</option>
        </select>
      </label>
      <button id="live" hidden title="Back to live playback (Esc)">
        <i class="icon-radio" aria-hidden="true"></i> Live
      </button>
    </header>
    <main>
      <aside id="side">
        <div id="unseen-bar" class="unseen-bar" hidden>
          <span class="unseen-dot"></span><span id="unseen-count"></span>
          <button id="mark-seen" title="Mark every changed file as seen">
            <i class="icon-check-check" aria-hidden="true"></i> Mark all seen
          </button>
        </div>
        <div id="files"></div>
        <div id="empty" class="muted empty">No changes yet — waiting for edits…</div>
      </aside>
      <div
        id="side-resizer"
        class="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the file list"
        aria-controls="side"
        tabindex="0"
        title="Drag to resize · arrow keys to adjust · double-click to reset"
      ></div>
      <section id="stage">
        <div id="progress" class="progress idle" aria-hidden="true">
          <div id="progress-fill"></div>
        </div>
        <div id="nowplaying" class="muted">
          <span id="np-text">Waiting for the assistant to edit something…</span>
          <span id="progress-label" class="muted"></span>
        </div>
        <div
          id="questions"
          class="questions"
          role="region"
          aria-label="Open questions from the agent"
          hidden
        ></div>
        <div id="commitbar" class="commitbar" hidden>
          <span id="cb-meta" class="muted"></span>
          <div id="cb-files" class="cb-files"></div>
        </div>
        <div id="editor"></div>
        <div id="diff" hidden></div>
      </section>
      <div
        id="tl-resizer"
        class="resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the session panel"
        aria-controls="timeline"
        tabindex="0"
        title="Drag to resize · arrow keys to adjust · double-click to reset"
      ></div>
      <div id="timeline" class="timeline" role="complementary" aria-label="Live session timeline">
        <div
          class="tl-controls"
          title="Live session: uncommitted edits seen since the server started"
        >
          <div class="tl-row">
            <span class="tl-title"><i class="icon-radio" aria-hidden="true"></i> Session</span>
            <span id="timeline-count" class="muted">0 edits</span>
            <button id="tl-collapse" class="icon" title="Collapse the session timeline">
              <i class="icon-panel-right-close" aria-hidden="true"></i>
            </button>
          </div>
          <div class="tl-row">
            <button id="prev" class="icon" title="Previous edit (←)">
              <i class="icon-chevron-left" aria-hidden="true"></i>
            </button>
            <button id="pause" class="icon" title="Pause live playback (Space)">
              <i class="icon-pause" aria-hidden="true"></i>
            </button>
            <button id="next" class="icon" title="Next edit (→)">
              <i class="icon-chevron-right" aria-hidden="true"></i>
            </button>
            <span id="queue" class="muted"></span>
          </div>
        </div>
        <div id="plan" class="plan" role="region" aria-label="Agent plan" hidden></div>
        <div
          id="timeline-items"
          class="tl-items"
          title="Oldest at the top, newest at the bottom"
        ></div>
      </div>
    </main>
    <div id="picker" class="picker" hidden>
      <div class="picker-panel" role="dialog" aria-label="Choose repository to watch">
        <div class="picker-head">
          <span><i class="icon-folder-git-2" aria-hidden="true"></i> Watch a repository</span>
          <button id="picker-close" class="icon" title="Close (Esc)">
            <i class="icon-x" aria-hidden="true"></i>
          </button>
        </div>
        <form id="picker-form" autocomplete="off">
          <input
            id="picker-path"
            spellcheck="false"
            placeholder="Filter, or type an absolute path (~/… works)"
          />
          <button type="submit"><i class="icon-eye" aria-hidden="true"></i> Watch</button>
        </form>
        <div id="picker-error" class="picker-error" hidden></div>
        <div class="picker-lists">
          <div class="picker-section">Recent</div>
          <ul id="picker-recent" class="picker-list"></ul>
          <div class="picker-section" id="picker-found-title">Found</div>
          <ul id="picker-found" class="picker-list"></ul>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
